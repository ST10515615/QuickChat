name: TestJava

# Run the tests every time code is pushed or a pull request is opened
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
          distribution: temurin
          java-version: '17'

      - name: Download JUnit 4 and Hamcrest
        run: |
          mkdir -p lib
          curl -fsSL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile the source and test files
        run: |
          mkdir -p out
          javac -cp "lib/*" -d out $(find src test -name "*.java")

      - name: Run the unit tests
        run: java -cp "out:lib/*" org.junit.runner.JUnitCore javaapplication1.LoginTest javaapplication1.MessageTest